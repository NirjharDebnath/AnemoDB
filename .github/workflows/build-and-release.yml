name: Build and Release AnemoDB

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Verify (Ubuntu Linux x86_64)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpqxx-dev libpq-dev g++ make cmake

      - name: Build with Makefile (-O3 Release)
        run: |
          make
          test -f anemo_db

      - name: Verify with CMake
        run: |
          cmake -B build -S .
          cmake --build build

      - name: Package Release Binary
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tar -czvf anemo-db-linux-x86_64.tar.gz anemo_db README.md LICENSE

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: anemo-db-linux-x86_64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
